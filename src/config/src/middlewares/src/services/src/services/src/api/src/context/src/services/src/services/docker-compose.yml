version: "3.9"
services:
  backend:
    build: ./server
    env_file: .env
    ports:
      - "4000:4000"
    restart: always
    depends_on:
      - db
      - redis
  frontend:
    build: ./client
    ports:
      - "3000:80"
    restart: always
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edu_platform
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
  redis:
    image: redis:7
    restart: always
volumes:
  db_data:
